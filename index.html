
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>차량 판매금액 자동 계산기</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      line-height: 1.6;
    }
    input {
      width: 100%;
      padding: 8px;
      margin: 6px 0 12px 0;
      box-sizing: border-box;
    }
    h2, h3 {
      color: #2c3e50;
    }
    p {
      background: #f4f4f4;
      padding: 8px;
      border-left: 4px solid #3498db;
    }
  </style>
</head>
<body>

  <h2>🚗 차량 판매금액 자동 계산기</h2>

  <label>정상 차량금액 (만원)</label>
  <input type="number" id="normalPrice" placeholder="예: 1800" oninput="calculate()" />

  <label>다운 계약금액 (만원)</label>
  <input type="number" id="downPrice" placeholder="예: 1730" oninput="calculate()" />

  <label>성능비 (만원)</label>
  <input type="number" id="performanceFee" value="56" oninput="calculate()" />

  <hr>

  <h3>📊 계산 결과</h3>
  <p><strong>정상계약 총비용:</strong> <span id="totalNormal">-</span> 만원</p>
  <p><strong>다운계약 총비용:</strong> <span id="totalDown">-</span> 만원</p>
  <p><strong>현금차액:</strong> <span id="cashGap">-</span> 만원</p>

  <script>
    function calculate() {
      const normal = parseFloat(document.getElementById('normalPrice').value);
      const down = parseFloat(document.getElementById('downPrice').value);
      const perf = parseFloat(document.getElementById('performanceFee').value);
      const fee = 44; // 매도비

      if (!isNaN(normal) && !isNaN(down) && !isNaN(perf)) {
        const normalTax = Math.ceil(normal * 0.085);
        const normalTotal = normal + normalTax + fee + perf;

        const downNet = down / 1.1;
        const downTax = Math.ceil(downNet * 0.07);
        const downTotal = down + downTax + fee + perf;

        const cashGap = Math.ceil(normalTotal - downTotal);

        document.getElementById('totalNormal').innerText = normalTotal;
        document.getElementById('totalDown').innerText = downTotal;
        document.getElementById('cashGap').innerText = cashGap;
      } else {
        document.getElementById('totalNormal').innerText = "-";
        document.getElementById('totalDown').innerText = "-";
        document.getElementById('cashGap').innerText = "-";
      }
    }
  </script>

</body>
</html>
